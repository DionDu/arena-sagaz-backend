[package]
name = "motor_xadrez"
# ⚠️ Esta é a versão que `xadrez_versao()` devolve ao app - ela vem daqui, por
# `env!("CARGO_PKG_VERSION")`, e o app a grava no log como `rust_0.5.0`.
# Suba-a sempre que o motor mudar de comportamento (outro lance em algum vetor de
# paridade, R-05). Um binário que mente sobre a própria versão torna o log de
# campo inútil.
#
# ⚠️ Trocar a versão da `cozy-chess` (travada abaixo e no `Cargo.lock`) também
# sobe ESTA versão: outra versão da biblioteca pode gerar os lances em outra
# ordem e mudar a escolha do motor (research.md R-05).
#
# 0.1.0 (14/11/2026): a fase 0a da spec 012 - posição, perft, busca alfa-beta
# com avaliação SÓ DE MATERIAL, as operações `perft` e `buscar`.
# 0.2.0 (14/11/2026): a fase 0b - as operações `estado`, `aplicar`, `recusa`,
# `radar` e `jogada_ideal`; o `buscar` passa a trazer os `fatos` do lance e a
# recusar a partida já terminada (`partida_terminada`). A busca e a avaliação
# NÃO mudaram: os lances e os nós da referência da bancada são os mesmos.
# 0.3.0 (16/11/2026): a T037 da fase 1 - a avaliação com as tabelas de peça por
# casa escritas por nós (meio-jogo e final, interpoladas por fase inteira) e os
# empates DENTRO da árvore de busca (repetição e 50 lances da modalidade). Os
# dois mudam os lances: a referência da bancada foi regerada.
# 0.4.0 (17/11/2026): a T038 - o ruído dos níveis (`niveis.rs`): o mate em um
# sai antes de tudo, e o erro é sorteado entre os lances plausíveis (nota de
# cada lance da raiz). Muda os lances da Cacau, da Pita e do Tex, e os nós do
# Magno nas posições com mate em um.
# 0.5.0 (17/11/2026): a T039 - a cegueira (`niveis::o_cego_nao_ve`): na
# resposta do adversário, o personagem cego não vê as capturas de cavalo nem
# as de peça em linha a 3 casas ou mais. Muda os lances da Pita.
version = "0.5.0"
edition = "2021"

[lib]
name = "motor_xadrez"
# cdylib  -> o `.so` do Android, a `.dll`/`.dylib` dos testes do Flutter
# staticlib -> o `.a` do iOS (research.md R-17)
# rlib    -> os testes de integração (`tests/`) e o crate `ferramentas_rust`
crate-type = ["cdylib", "staticlib", "rlib"]

[profile.release]
# LTO "fat" e uma unidade de compilação: o binário sai menor e mais rápido. É
# lento de compilar de propósito - isto não roda a cada build do app.
lto = "fat"
codegen-units = 1
# ⚠️ NUNCA ponha `panic = "abort"` aqui (o mesmo aviso do motor das damas).
# Com "abort", qualquer índice fora de faixa dentro do motor mata o PROCESSO -
# o app fecha sozinho, sem exceção em Dart e sem nada no log. Com "unwind", o
# `catch_unwind` da borda FFI (src/ffi.rs) transforma o mesmo acidente num JSON
# `{"ok": false, "erro": "panico"}`, e o app continua vivo.
panic = "unwind"

[dependencies]
# O gerador de lances (MIT). Travado com `=`: a versão é parte do motor, e uma
# atualização silenciosa poderia mudar a ordem dos lances gerados (R-05).
# Nenhum código do Stockfish, da `shakmaty` ou do `dartchess` entra aqui.
cozy-chess = "=0.3.4"
# As mesmas versões do motor das damas (`jogo_damas/motor_rust/Cargo.toml`).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
